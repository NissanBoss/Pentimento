name: Test

# All three systems, on files the tests build themselves: screenshots
# saved over, thumbnails left behind, slides with crops, drawings with
# pages nobody sees. The real files are in samples.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -v ./...

      - name: The other systems still compile
        shell: bash
        run: |
          for target in windows linux darwin; do
            GOOS=$target go vet .
            GOOS=$target go build -o /dev/null .
          done
